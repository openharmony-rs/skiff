[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
exclude = ["servo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
dpi = "0.1"
env_filter = "0.1.4"
euclid = "0.22"
flate2 = "1.1"
headers = "0.4"
hilog = "0.2.2"
ipc-channel = "0.22"
keyboard-types = { version = "0.8.3", features = ["serde", "webdriver"] }
log = "0.4.32"
napi-derive-ohos = "1.2.0"
napi-ohos = "1.2.0"
ohos-abilitykit-sys = { version = "0.1.6", features = ["api-16"] }
ohos-ime = "0.4.2"
ohos-ime-sys = "0.2.4"
ohos-sys-opaque-types = "0.1.7"
ohos-vsync = "0.1.3"
ohos-window-manager-sys = { version = "0.1", features = ["api-14"] }
ohos-window-sys = "0.1.7"
raw-window-handle = "0.6"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
serde_json = "1.0"
servo = { path = "servo/components/servo", default-features = false }
servo-default-resources = { path = "servo/components/default-resources" }
skiff-core = { path = "crates/core" }
url = "2.5"
xcomponent-sys = { version = "0.4.0", features = ["api-20", "keyboard-types"] }

# Servo's workspace settings that do not reach dependents. Keep in sync with servo's Cargo.toml.
[patch.crates-io]
freetype-sys = { path = "servo/third_party/freetype-sys/freetype-sys" }

[profile.medium]
inherits = "dev"
opt-level = 2
incremental = true
debug = "line-tables-only"

[profile.production]
inherits = "release"
debug-assertions = false
lto = true
codegen-units = 1
opt-level = "s"

[profile.profiling]
inherits = "release"
debug-assertions = false
debug = true
lto = "thin"
codegen-units = 1
