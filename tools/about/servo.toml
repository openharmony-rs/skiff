# The configuration of cargo-about for Servo's own dependencies. It is a proposal for servo's
# about.toml, and tools/update-licenses.py combines it with overlay.toml. mozjs_sys is missing, since
# update-licenses.py adds its notices.

accepted = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-2-Clause-Views",
    "BSD-3-Clause",
    "BSL-1.0",
    "blessing",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "dtoa",
    "FTL",
    "ICU",
    "ISC",
    "libpng-2.0",
    "MIT",
    "MIT-Modern-Variant",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "OFL-1.1",
    "SunPro",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

